name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"
      - name: Sync deps
        run: uv sync --frozen
      - name: Pytest
        run: uv run python -m pytest
      - name: Import web app
        run: uv run python -c "from event_discovery.web import app; assert app.title"
