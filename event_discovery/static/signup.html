<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Event discovery</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          if (mode === "auto") {
            root.removeAttribute("data-theme");
          } else {
            root.setAttribute("data-theme", mode);
          }
          root.style.colorScheme = resolved;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to form</a>
    <div class="login-page">
      <div class="login-toolbar" role="group" aria-label="Appearance">
        <span class="theme-toggle-label" aria-hidden="true">Theme</span>
        <button type="button" class="theme-toggle" id="themeToggle">Auto</button>
      </div>
      <main id="main-content" class="signup-main" tabindex="-1">
        <div id="signupClosed" class="login-card" hidden>
          <h1>Registration unavailable</h1>
          <p class="lede">New accounts are not open on this server.</p>
          <p class="footer-link"><a href="/login">Back to sign in</a></p>
        </div>
        <div id="signupOpen" class="login-card">
          <h1>Create your account</h1>
          <p class="lede">You will get your own workspace for sources and events.</p>
          <p id="signupError" class="login-error" hidden role="alert"></p>
          <form id="signupForm">
            <label class="field field-grow">
              <span>Email</span>
              <input type="email" name="email" id="email" required autocomplete="username" />
            </label>
            <label class="field field-grow">
              <span>Password</span>
              <input
                type="password"
                name="password"
                id="password"
                required
                minlength="8"
                autocomplete="new-password"
                aria-describedby="pwHint"
              />
            </label>
            <p id="pwHint" class="lede" style="margin: -0.5rem 0 0; font-size: 0.85rem">
              At least 8 characters.
            </p>
            <div class="login-actions">
              <button type="submit" class="btn" id="submitBtn">Create account</button>
            </div>
          </form>
          <p class="footer-link">Already have an account? <a href="/login">Sign in</a></p>
        </div>
      </main>
    </div>
    <script src="/assets/theme.js"></script>
    <script type="module">
      const closedEl = document.getElementById("signupClosed");
      const openEl = document.getElementById("signupOpen");

      async function tryMe() {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (res.ok) {
          window.location.href = "/";
        }
      }
      await tryMe();

      const statusRes = await fetch("/api/auth/signup-status");
      const status = statusRes.ok ? await statusRes.json() : { allowed: false };
      if (!status.allowed) {
        closedEl.hidden = false;
        openEl.hidden = true;
      } else {
        closedEl.hidden = true;
        openEl.hidden = false;
        const form = document.getElementById("signupForm");
        const err = document.getElementById("signupError");
        const btn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          err.hidden = true;
          btn.disabled = true;
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          try {
            const res = await fetch("/api/auth/signup", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            if (!res.ok) {
              let msg = "Sign up failed.";
              try {
                const data = await res.json();
                if (data.detail) {
                  msg = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
                }
              } catch {
                msg = (await res.text()) || msg;
              }
              err.textContent = msg;
              err.hidden = false;
              return;
            }
            window.location.href = "/";
          } catch (ex) {
            err.textContent = ex.message || "Network error.";
            err.hidden = false;
          } finally {
            btn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
