<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Event discovery</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = mode === "auto" ? (prefersDark ? "dark" : "light") : mode;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          if (mode === "auto") {
            root.removeAttribute("data-theme");
          } else {
            root.setAttribute("data-theme", mode);
          }
          root.style.colorScheme = resolved;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to sign in</a>
    <div class="login-page">
      <div class="login-toolbar" role="group" aria-label="Appearance">
        <span class="theme-toggle-label" aria-hidden="true">Theme</span>
        <button type="button" class="theme-toggle" id="themeToggle">Auto</button>
      </div>
      <main id="main-content" class="login-main" tabindex="-1">
        <div class="login-card">
          <h1>Event discovery</h1>
          <p class="lede">Sign in to manage sources and triage events.</p>
          <p id="loginError" class="login-error" hidden role="alert"></p>
          <form id="loginForm">
            <label class="field field-grow">
              <span>Email</span>
              <input type="email" name="email" id="email" required autocomplete="username" />
            </label>
            <label class="field field-grow">
              <span>Password</span>
              <input type="password" name="password" id="password" required autocomplete="current-password" />
            </label>
            <div class="login-actions">
              <button type="submit" class="btn" id="submitBtn">Sign in</button>
            </div>
          </form>
          <p class="footer-link" id="signupLink" hidden>
            New here? <a href="/signup">Create an account</a>
          </p>
        </div>
      </main>
    </div>
    <script src="/assets/theme.js"></script>
    <script type="module">
      const signupLink = document.getElementById("signupLink");
      try {
        const st = await fetch("/api/auth/signup-status");
        if (st.ok) {
          const j = await st.json();
          if (j.allowed) {
            signupLink.hidden = false;
          }
        }
      } catch {
        /* ignore */
      }

      const form = document.getElementById("loginForm");
      const err = document.getElementById("loginError");
      const btn = document.getElementById("submitBtn");

      async function tryMe() {
        const res = await fetch("/api/auth/me", { credentials: "include" });
        if (res.ok) {
          window.location.href = "/";
        }
      }
      await tryMe();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.hidden = true;
        btn.disabled = true;
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          if (!res.ok) {
            const text = await res.text();
            err.textContent = text || "Sign-in failed.";
            err.hidden = false;
            return;
          }
          window.location.href = "/";
        } catch (ex) {
          err.textContent = ex.message || "Network error.";
          err.hidden = false;
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
